name: Apple Watch build

on:
  pull_request:
    paths:
      [
        "mobile/targets/**",
        "mobile/modules/**",
        "mobile/app.json",
        "mobile/package*.json",
        "mobile/scripts/check-watch-target.cjs",
        "mobile/scripts/report-apple-build.cjs",
        ".github/workflows/apple-watch.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "mobile/targets/**",
        "mobile/modules/**",
        "mobile/app.json",
        "mobile/package*.json",
        "mobile/scripts/check-watch-target.cjs",
        "mobile/scripts/report-apple-build.cjs",
        ".github/workflows/apple-watch.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch-simulator:
    # Expo SDK 58 uses Xcode 27.1. macos-15 still defaults to Xcode 16.4.
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27.1 and simulator SDKs
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk watchsimulator --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
      - run: node scripts/check-watch-target.cjs
      - name: Compile the SwiftUI watch app without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/VYRO.xcodeproj -target VyroWatch -sdk watchsimulator -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/vyro-watch-build" build 2>&1 | tee "$RUNNER_TEMP/vyro-watch-build.log"
      - run: pod install --project-directory=ios
      - name: Compile the iPhone app and native WatchConnectivity bridge
        run: |
          set -o pipefail
          xcodebuild -workspace ios/VYRO.xcworkspace -scheme VYRO -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/vyro-iphone-build.log"
      - name: Report Xcode errors in the build summary
        if: failure()
        run: node scripts/report-apple-build.cjs "$RUNNER_TEMP/vyro-watch-build.log" "$RUNNER_TEMP/vyro-iphone-build.log"
      - name: Save compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-logs
          path: ${{ runner.temp }}/vyro-*-build.log
          if-no-files-found: ignore
          retention-days: 7
